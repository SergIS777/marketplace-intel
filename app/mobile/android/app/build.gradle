plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.marketplace_intel"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17" // В Groovy/Kotlin DSL лучше передавать строкой
    }

    defaultConfig {
        applicationId = "com.example.marketplace_intel"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Библиотеки для работы Flutter Engine
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.7.0"
    
    // Window 1.1.0 — стабильная версия с getOrCreate()
    implementation "androidx.window:window:1.1.0"
    implementation "androidx.window:window-java:1.1.0"
}

configurations.all {
    resolutionStrategy {
        // Жесткая фиксация версий для предотвращения конфликтов
        force "androidx.window:window:1.1.0"
        force "androidx.window:window-java:1.1.0"
        force "androidx.lifecycle:lifecycle-process:2.7.0"
        force "androidx.lifecycle:lifecycle-runtime:2.7.0"
        force "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
        force "androidx.lifecycle:lifecycle-common:2.7.0"
        force "androidx.lifecycle:lifecycle-common-java8:2.7.0"
        force "androidx.core:core:1.12.0"
        force "androidx.core:core-ktx:1.12.0"
    }
}
plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.marketplace_intel"
    // Явно указываем 34, чтобы избежать динамических подтягиваний и варнингов AGP 8.1.0
    compileSdk = 34 
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.marketplace_intel"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // ЖЕСТКАЯ фиксация версии. strictly запрещает Gradle понижать версию 
    // даже для транзитивных зависимостей от flutter_embedding.
    implementation('androidx.window:window') {
        version {
            strictly '1.3.0'
        }
    }
    implementation('androidx.window:window-java') {
        version {
            strictly '1.3.0'
        }
    }
}
plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.marketplace_intel"
    // Явно указываем 34, чтобы избежать динамических подтягиваний и варнингов AGP 8.1.0
    compileSdk = 34 
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.marketplace_intel"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Принудительно используем версию 1.5.0, где @JvmStatic добавлен к getOrCreate()
    implementation('androidx.window:window') {
        version {
            strictly '1.5.0'
        }
    }
    implementation('androidx.window:window-java') {
        version {
            strictly '1.5.0'
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'androidx.window:window:1.5.0'
        force 'androidx.window:window-java:1.5.0'
    }
}
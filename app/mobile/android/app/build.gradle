plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.marketplace_intel"
    // Явно указываем 34, чтобы избежать динамических подтягиваний и варнингов AGP 8.1.0
    compileSdk = 34 
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.marketplace_intel"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Принудительно добавляем нужные версии, чтобы они точно попали в граф зависимостей
    implementation "androidx.window:window:1.3.0"
    implementation "androidx.window:window-java:1.3.0"
}

// ВАЖНО: Используем configureEach вместо all для ленивой (lazy) настройки.
// Это гарантирует, что правила применятся ПОСЛЕ того, как Flutter добавит свои зависимости.
configurations.configureEach {
    resolutionStrategy {
        // Жёстко фиксируем версии, отбрасывая транзитивные 1.1.0
        force "androidx.window:window:1.3.0"
        force "androidx.window:window-java:1.3.0"
    }
}
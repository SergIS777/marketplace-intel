plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.marketplace_intel"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.marketplace_intel"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Движок Flutter 3.24 вызывает статический WindowMetricsCalculator.getOrCreate(),
    // который есть только в androidx.window 1.2.0+. Фиксируем 1.3.0.
    implementation "androidx.window:window:1.3.0"
    implementation "androidx.window:window-java:1.3.0"
}

configurations.all {
    resolutionStrategy {
        // Жёстко бьём по рукам все транзитивные зависимости, которые тянут 1.1.0
        force "androidx.window:window:1.3.0"
        force "androidx.window:window-java:1.3.0"
    }
}